name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Show compiler version
        run: clang++ --version

      - name: Run the test suite
        run: make test CXX=clang++

  strict:
    name: Strict warnings
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Compiles with -Wshadow -Wconversion -Wsign-conversion and friends.
      # These are kept out of the default build so everyday compiles stay
      # quiet, but a regression here should still fail the pipeline.
      - name: Compile with the strict warning set
        run: make strict CXX=clang++

  sanitizers:
    name: ASan + UBSan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Several real defects in this codebase were out-of-bounds reads caused
      # by unsigned loop bounds underflowing. They compiled and ran without
      # complaint; only a sanitizer caught them.
      - name: Run the tests under AddressSanitizer and UBSan
        run: make test-asan CXX=clang++
        env:
          ASAN_OPTIONS: detect_leaks=0
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1

  bot:
    name: Bot (solver + engine + SDK)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: .github/workflows/ci.yml

      # chipzen-bot is the version the Docker image is validated with.
      # pokerkit 0.7.8 is what the local bench venv runs (no pin in the repo).
      - name: Install Python dependencies
        run: pip install chipzen-bot==0.7.1 pybind11 pokerkit==0.7.8 pytest

      - name: Build the CLI solver
        run: |
          g++ -std=c++17 -O2 -o /tmp/solver chipzen/solver.cpp \
            montecarlo/MonteCarloSimulator.cpp model/advanced_hand_evaluator.cpp \
            model/card.cpp

      - name: Build the engine module
        run: tools/build_engine.sh
        env:
          PY: python

      - name: Test the solver
        run: python chipzen/test_solver.py /tmp/solver

      - name: Test the bot against the SDK
        run: PYTHONPATH=chipzen python chipzen/test_bot_sdk.py

      - name: Test the v4 behaviour checks
        run: PYTHONPATH=chipzen POKERCPP_SIMS=2000 python chipzen/test_v4.py

      - name: Test the logging
        run: python chipzen/test_logging.py

      - name: Test the engine seed
        # The test reads sys.argv[1] as a module dir, so the file goes in
        # PYTEST_ADDOPTS to keep it off the command line.
        run: python -m pytest
        env:
          PYTEST_ADDOPTS: chipzen/test_engine_seed.py

      - name: Test replay
        run: PYTHONPATH=chipzen python chipzen/test_replay.py

      - name: Test the preflop realization
        run: python chipzen/test_preflop_realization.py

      - name: Test the paired comparison
        run: python tools/test_paired.py

      - name: Test the opponent
        run: PYTHONPATH=chipzen python chipzen/test_opponent.py

      - name: Test the decision constants
        run: PYTHONPATH=chipzen python chipzen/test_decide_constants.py

      - name: Test the villain raise counting
        run: PYTHONPATH=chipzen python chipzen/test_villain_raises.py

      - name: Test the wire legality
        run: PYTHONPATH=chipzen python chipzen/test_wire.py

      - name: Test engine-direct against bot.py parity
        run: PYTHONPATH=chipzen python tools/test_parity.py --pairs 50

      - name: Test the match blind schedule
        run: PYTHONPATH=chipzen python tools/test_match.py

      - name: Test the Monte Carlo seed key
        run: PYTHONPATH=chipzen python tools/test_seed_key.py

      - name: Test the paired McNemar comparison
        run: PYTHONPATH=chipzen python tools/test_mcnemar.py
