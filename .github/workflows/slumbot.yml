name: Slumbot

# Not on push or pull_request: an outside outage must never turn a PR check red.
on:
  schedule:
    - cron: '17 11,23 * * *'
  workflow_dispatch:
    inputs:
      hands:
        description: Hands to play
        default: '1000'
      sims:
        description: Monte Carlo simulations per decision
        default: '5000'

permissions:
  contents: read

concurrency:
  group: slumbot
  cancel-in-progress: false

jobs:
  slumbot:
    name: Slumbot session
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: .github/workflows/ci.yml

      - name: Install Python dependencies
        run: pip install chipzen-bot==0.7.1 pybind11 pokerkit==0.7.8 pytest

      - name: Play the session
        run: tools/slumbot_ci.sh out "$HANDS" "$SIMS" "$SEED"
        env:
          PY: python
          HANDS: ${{ inputs.hands || '1000' }}
          SIMS: ${{ inputs.sims || '5000' }}
          SEED: ${{ github.run_number }}

      - name: Summary
        if: always()
        run: |
          {
            echo '```'
            grep -h '^hands played' out/run.txt || true
            grep -h '^rejected actions' out/run.txt || true
            head -n 12 out/report.txt || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: slumbot-${{ github.run_number }}-${{ github.sha }}
          path: out/
          retention-days: 90
